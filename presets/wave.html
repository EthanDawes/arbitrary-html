<style>
body {
font-family: sans-serif;
font-size: 14pt;
}
.wavy-text{filter:url('#wavy')}
</style>

<!-- Adapted from http://www.coding-dude.com/wp/wavy-text-generator/ -->
<input type="checkbox" onchange="document.getElementById('main').className = this.checked ? 'wavy-text' : ''" checked /> Enable Wavy Text
<div class="wavy-text" id="main"><p>This is my essay</p></div>
<svg width="100%" height="100%" style="display:none;">
<defs>
<filter id="wavy" filterUnits="userSpaceOnUse" x="0" y="0">
<feTurbulence id="wave-animation" numOctaves="1" seed="1" baseFrequency="0 0"></feTurbulence>
<feDisplacementMap scale="10" in="SourceGraphic"></feDisplacementMap>
</filter><animate xlink:href="#wave-animation" attributeName="baseFrequency" dur="3s" keyTimes="0;0.5;1" values="0.0 0.04;0.0 0.07;0.0 0.04" repeatCount="indefinite"></animate>
</defs>
</svg>
