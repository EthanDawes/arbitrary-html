<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Chart.js Demo</title>
  <style>
    html, body {
      margin: 0;
      background: #f5f5f5;
    }
    #chartContainer {
      position: relative;
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="chartContainer">
    <canvas id="myChart"></canvas>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('myChart').getContext('2d');

    const YOUR_CHART_HERE = {
      type: 'line', // Try 'bar', 'pie', etc.
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
        datasets: [{
          label: 'Demo Dataset',
          data: [12, 19, 3, 5, 2, 3, 10],
          borderColor: 'rgba(75, 192, 192, 1)',
          backgroundColor: 'rgba(75, 192, 192, 0.2)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: 'Fullscreen Chart.js Demo' }
        }
      }
    }

    const chart = new Chart(ctx, YOUR_CHART_HERE /* CHART ENDS*/);
  </script>
</body>
</html>
