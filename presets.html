<title>Presets | Arbitrary HTML</title>
<link rel="icon"
      href="https://cdn.glitch.com/3b5435b3-c38c-479b-a5a7-d254c2e23cc0%2Fchaos.png?v=1600527757494">

<h1>Preset Templates</h1>

<style>
* {
  box-sizing: border-box;
}

#main {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

#main * {
  margin: 5px;
  width: 100%;
  max-width: 460px;
  height: 300px;
}

iframe {
  pointer-events: none;
}
</style>

<div id="main"></div>

<script>
const templates = [
  "#editurl=presets/boilerplate.html",
  "#editurl=presets/gradient.html",
  "#editurl=presets/markdown.html",
  "#editurl=presets/blink.html",
  "#editurl=presets/typer.html",
  "#editurl=presets/quiz.html",
  "presets/notes.html",
  "#editurl=presets/tts.html",
  "#editurl=presets/wave.html",
  "#editurl=presets/terminal.html",
  "presets/month-calendar.html",
  "presets/schedule.html",
  "presets/week-calendar.html",
  "#editurl=presets/chartjs.html",
  "presets/flashcards.html",
];
const main = document.getElementById('main');


let dir = location.pathname;
dir = dir.substring(0, dir.lastIndexOf('/'));
const basePath = "../";

// Convienence for README so I don't retype all the URLs
const redir = new URLSearchParams(location.search).get("redir");
if (redir)
   location.assign(basePath + templates[redir]);
else {
  for (let template of templates) {
    main.innerHTML += `<a href="${basePath + template}"><iframe src="${basePath + template.replace(/^#editurl=/, '')}" disabled></iframe></a>`;
  }
}
</script>
